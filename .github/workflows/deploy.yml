name: Deploy Backend Runner

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend-runner/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 1. Build and Push the Runtime Image (The environment where code runs)
    - name: Build and push Runtime Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend-runner
        file: ./backend-runner/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-runner:latest

    # 2. Build and Push the Server Image (The WebSocket API)
    - name: Build and push Server Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend-runner
        file: ./backend-runner/Dockerfile.server
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-runner:latest

    # 3. Deploy to AWS EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull the latest images
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python-runner:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend-runner:latest
          
          # Ensure firewall allows 8080
          sudo ufw allow 8080/tcp || true

          # Stop and remove existing container
          docker stop backend-runner || true
          docker rm backend-runner || true
          
          # Run the new container
          # We mount /var/run/docker.sock so the container can spawn sibling containers
          docker run -d \
            --name backend-runner \
            --restart unless-stopped \
            -p 8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-runner:latest
