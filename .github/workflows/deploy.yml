name: Deploy Backend Runner

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 1. Build and Push the Runtime Image (The environment where code runs)
    - name: Build and push Runtime Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend-runner
        file: ./backend-runner/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-runner:latest

    # 2. Build and Push the Server Image (The WebSocket API)
    - name: Build and push Server Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend-runner
        file: ./backend-runner/Dockerfile.server
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-runner:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-runner:${{ github.sha }}

    # 3. Deploy to AWS EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        script: |
          echo "=== Environment Debug ==="
          which docker || echo "Docker not in PATH"
          ls -la /var/run/docker.sock || echo "Docker socket missing"
          docker info || echo "Docker daemon not reachable"
          echo "========================"

          # 🧹 AGGRESSIVE CLEANUP - FREE UP DISK SPACE
          echo "=== Disk Usage Before Cleanup ==="
          df -h
          
          echo "Cleaning up Docker system..."
          # Remove all unused containers, networks, images (both dangling and unreferenced)
          docker system prune -af
          docker volume prune -f
          
          echo "Cleaning up apt cache..."
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "=== Disk Usage After Cleanup ==="
          df -h

          # Pull the latest images AND the specific version
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python-runner:latest
          
          echo "New Backend Image ID:"
          docker image inspect ${{ secrets.DOCKERHUB_USERNAME }}/backend-runner:${{ github.sha }} --format '{{.Id}}'
          
          # Tag python-runner so the server can find it
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/python-runner:latest python-runner:latest
          
          # Configure firewall
          sudo ufw allow 8080/tcp || true
          
          # Stop and remove existing container
          docker stop backend-runner 2>/dev/null || true
          docker rm backend-runner 2>/dev/null || true
          
          # Run the new container
          docker run -d \
            --name backend-runner \
            --restart unless-stopped \
            -p 8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-runner:${{ github.sha }}
          
          # Wait for container to start
          sleep 5
          
          # Show status
          echo "=== Container Status ==="
          docker ps | grep backend-runner
          
          echo "=== Container Logs ==="
          docker logs backend-runner
          
          echo "=== Port Check ==="
          sudo ss -tulpn | grep 8080 || sudo netstat -tulpn | grep 8080
